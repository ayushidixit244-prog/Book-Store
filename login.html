<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="login_style.css">
</head>
<body>
    <div class="login-container">
        <div class="side-bar">
            <h1>Welcome Back reader!</h1>
            <p>Discover your next great adventure. Log in to access your custom bookshelf, 
             pending orders, and personalized reading recommendations.</p>
        </div>
        <div class="form-section">
            <h2>📚 The Book Corner</h2>
            <form >
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="admissionnumber@glbitm.ac.in">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="button">Sign In</button>
                <button type="reset" class="button">Reset</button>
            </form>
            <p>Don't have an account? <a href="register.html">Sign up here</a></p>           
        </div>
    </div>      
        
</body>
</html>
